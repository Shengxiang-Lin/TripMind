model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16

dataset_dir: ./data
dataset: travel_sft_train
eval_dataset: travel_sft_val
template: qwen
cutoff_len: 1024

output_dir: ./checkpoints/qwen2.5-0.5b-trip-lora-v2
logging_steps: 1
plot_loss: true
report_to: none
eval_strategy: steps
eval_steps: 10
save_strategy: steps
save_steps: 10
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: loss
greater_is_better: false

per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
bf16: true
