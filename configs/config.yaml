project:
  name: TripMind
  mode: local

providers:
  # auto | local | ors
  route: auto
  # auto | local | dashscope
  realtime: auto

dashscope:
  api_key: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen-plus"
  realtime_model: "qwen-plus"
  search_strategy: "turbo"

ors:
  api_key: ""
  base_url: "https://api.heigit.org/openrouteservice"
  timeout_seconds: 15

realtime:
  ttl_seconds: 3600
  poi_limit: 6

training:
  # Main small-model supervision: GenUP profile + visit history + real next POI.
  preference:
    sources:
      - nyc
      - tky
      - ca
    output_dir: "data/processed/genup_preference"
    validation_fraction: 0.10
    negatives_per_positive: 4
    hard_negative_fraction: 0.50

  # Optional research/debug utility only; not required for the main model.
  ranking:
    candidate_count: 8
    knowledge_top_k: 3
    teacher_model: "qwen-plus"
    train_limit: 100
    validation_limit: 30
    test_limit: 100

data:
  use_processed: true
  bundle_root: "data/processed/production"
  poi_dir: "data/poi"
  knowledge_file: "data/knowledge/travel_knowledge.json"
  raw_dir: "data/raw"
  processed_dir: "data/processed"

  chinatravel:
    repo_id: "LAMDA-NeSy/ChinaTravel"
    revision: "main"

  chinatravel_sandbox:
    repo_id: "LAMDA-NeSy/ChinaTravel-Sandbox"
    revision: "main"

  wikivoyage:
    languages:
      - zh
      - en
    dump_filename: "{lang}wikivoyage-latest-pages-articles.xml.bz2"
    dump_url: "https://dumps.wikimedia.org/{lang}wikivoyage/latest/{filename}"

  public_preferences:
    genup:
      nyc:
        repo_id: "w11wo/FourSquare-NYC-POI"
        revision: "main"
      tky:
        repo_id: "w11wo/FourSquare-TKY-POI"
        revision: "main"
      ca:
        repo_id: "w11wo/Gowalla-CA-POI"
        revision: "main"
    # Optional auxiliary dataset, not downloaded by --source all/genup.
    stravl:
      csv_url: "https://raw.githubusercontent.com/Stravl/Stravl-Data/main/Stravl_Travel_Preference_Data.csv"
      destinations_url: "https://raw.githubusercontent.com/Stravl/Stravl-Data/main/destination_ids.txt"
      source_url: "https://github.com/Stravl/Stravl-Data"
