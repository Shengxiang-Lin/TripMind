project:
  name: TripMind
  mode: local

providers:
  # auto | local | ors
  route: auto
  # auto | local | dashscope
  realtime: auto

dashscope:
  # Leave empty in the tracked file. Put real secrets in
  # configs/config.local.yaml or environment variables.
  api_key: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen-plus"
  realtime_model: "qwen-plus"
  search_strategy: "turbo"

ors:
  api_key: ""
  # New HeiGIT endpoint. api.openrouteservice.org is deprecated.
  base_url: "https://api.heigit.org/openrouteservice"
  timeout_seconds: 15

realtime:
  ttl_seconds: 3600
  poi_limit: 6

training:
  # Public supervision is the primary preference-learning source.
  public_preferences:
    seed: 42
    output_dir: "data/processed/public_preferences"
  # ChinaTravel listwise ranking is now a small task-alignment/calibration set,
  # not the main source of thousands of paid teacher labels.
  ranking:
    candidate_count: 8
    knowledge_top_k: 3
    teacher_model: "qwen-plus"
    train_limit: 300
    validation_limit: 100
    test_limit: 100

data:
  use_processed: true
  bundle_root: "data/processed/production"
  poi_dir: "data/poi"
  knowledge_file: "data/knowledge/travel_knowledge.json"
  raw_dir: "data/raw"
  processed_dir: "data/processed"

  chinatravel:
    repo_id: "LAMDA-NeSy/ChinaTravel"
    revision: "main"

  chinatravel_sandbox:
    repo_id: "LAMDA-NeSy/ChinaTravel-Sandbox"
    revision: "main"

  wikivoyage:
    languages:
      - zh
      - en
    dump_filename: "{lang}wikivoyage-latest-pages-articles.xml.bz2"
    dump_url: "https://dumps.wikimedia.org/{lang}wikivoyage/latest/{filename}"

  public_preferences:
    stravl:
      csv_url: "https://raw.githubusercontent.com/Stravl/Stravl-Data/main/Stravl_Travel_Preference_Data.csv"
      destinations_url: "https://raw.githubusercontent.com/Stravl/Stravl-Data/main/destination_ids.txt"
      source_url: "https://github.com/Stravl/Stravl-Data"
    genup:
      nyc:
        repo_id: "w11wo/FourSquare-NYC-POI"
        revision: "main"
      tky:
        repo_id: "w11wo/FourSquare-TKY-POI"
        revision: "main"
      ca:
        repo_id: "w11wo/Gowalla-CA-POI"
        revision: "main"
